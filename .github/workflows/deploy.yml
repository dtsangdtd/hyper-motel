name: CI/CD Deploy Spring Boot with Docker Compose to VPS

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy mã nguồn từ GitHub
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Cài đặt môi trường Java để build
      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 3. Build file JAR (Bỏ qua test)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Copy các file cần thiết (Jar, Dockerfile, Docker Compose) lên VPS
      - name: Copy Deployment Files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "target/*.jar,Dockerfile,docker-compose.yml"
          target: "/root/hyper-motel/api/"

      # 5. SSH vào VPS để khởi chạy Docker Compose
      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /root/hyper-motel/api
            
            # Đổi vị trí và tên file jar cho đúng cấu hình Dockerfile
            rm -f app.jar
            mv target/*.jar app.jar
            rm -rf target
            
            # Triển khai bằng Docker Compose
            sudo docker compose down || true
            sudo docker compose up -d --build
            
            # Dọn dẹp các Image cũ bị thừa để tránh đầy bộ nhớ VPS
            sudo docker image prune -f