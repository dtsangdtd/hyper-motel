spring.datasource.url=jdbc:postgresql://109.123.234.219:5432/motel
spring.datasource.username=postgres
spring.datasource.password=Hieu1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
server.port=8080

app.security.oauth2.client-id=swagger-client
app.security.oauth2.client-secret=swagger-secret
app.security.oauth2.token-validity-seconds=3600
app.security.jwt.secret=hyper-app-jwt-secret-key-2026-256-bit-minimum

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.instances.studentService.register-health-indicator=true
resilience4j.circuitbreaker.instances.studentService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.studentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.studentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.studentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.studentService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.studentService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.studentService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.studentService.ignore-exceptions=hyper.exception.CustomerNotFoundException

resilience4j.circuitbreaker.instances.authService.register-health-indicator=true
resilience4j.circuitbreaker.instances.authService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.authService.sliding-window-size=10
resilience4j.circuitbreaker.instances.authService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.authService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.authService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.authService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.authService.ignore-exceptions=hyper.exception.AuthException
